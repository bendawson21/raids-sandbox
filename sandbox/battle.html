<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Raids — Battle Sim</title>
<link rel="stylesheet" href="style.css">
<style>
  #battlebar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px;
    align-items: center; background: rgba(0,0,0,0.45); padding: 6px 8px; border-radius: 10px; }
  #battlebar button { padding: 8px 12px; font-size: 14px; }
  #battlebar span { color: #e3b552; font: 13px ui-monospace, Consolas, monospace; min-width: 38px; text-align: center; }
  @media (max-width: 700px) {
    #hud { left: 6px; top: 6px; }
    #help { font-size: 11px; padding: 4px 8px; }
    #stats { font-size: 10px; }
    #battlebar { bottom: max(10px, env(safe-area-inset-bottom)); }
    #battlebar button { padding: 10px 10px; font-size: 13px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud" style="max-width:calc(100% - 24px)">
  <div id="loading">Loading assets…</div>
  <div id="help">
    <b>Battle sim</b> · five factions fight for the centre · <b>WASD</b> pan · <b>Wheel</b> zoom
    · <b>Middle-drag</b> / <b>Q E</b> orbit · <b>R</b> reset view · <b>[ ]</b> speed · <b>P</b> pause
    · <a href="index.html" style="color:#e3b552;pointer-events:auto">character sandbox</a>
  </div>
  <div id="stats"></div>
</div>
<div id="floaters"></div>
<script type="module" src="js/battle.js"></script>
</body>
</html>
